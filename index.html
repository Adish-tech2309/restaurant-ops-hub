<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant Ops Hub</title>
<style>
/* ============ Restaurant Ops Hub — warm, mobile-first, offline styles ============ */
:root{
  --bg:#FBF5EC; --card:#FFFFFF; --ink:#3A2A20; --muted:#8A7565;
  --accent:#C2410C; --accent-dark:#9A3412; --accent-soft:#FDEBDD;
  --green:#2F855A; --green-soft:#E2F2E9; --red:#C0392B; --red-soft:#FBE4E0;
  --blue:#2B6CB0; --blue-soft:#E3EEFB; --line:#EADFCF; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45;padding-bottom:150px}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
/* Header */
.app-head{background:#402E22;color:#FFF7EC;padding:14px 0 12px;position:sticky;top:0;z-index:50}
.app-head h1{font-size:1.15rem;margin:0}
.app-head .sub{font-size:.8rem;opacity:.75;margin-top:2px}
/* Tabs */
.tab{display:none}
.tab.active{display:block;animation:fade .15s ease-in}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.tab h2{font-size:1.25rem;margin:18px 0 10px}
/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(60,30,10,.06)}
.card h3{margin:0 0 8px;font-size:1.02rem}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:right}
.big{font-size:1.6rem;font-weight:800}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.stat .lbl{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .num{font-size:1.35rem;font-weight:800;margin-top:2px}
.stat .det{font-size:.8rem;color:var(--muted);margin-top:2px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);
  border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
/* Buttons */
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 18px;font-size:1rem;font-weight:700;
  cursor:pointer;min-height:48px;text-align:center;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:hover{background:var(--accent-dark)}
.btn-green{background:var(--green);color:#fff;width:100%}
.btn-blue{background:var(--blue);color:#fff;width:100%}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1px solid #EFC5BE}
.btn-danger-solid{background:var(--red);color:#fff;width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn-row .btn{flex:1;min-width:120px;width:auto}
/* Forms */
.field{margin:0 0 12px}
.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:13px;border:2px solid var(--line);
  border-radius:12px;font-size:1rem;background:#fff;color:var(--ink);min-height:48px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.field .err{color:var(--red);font-size:.82rem;margin-top:4px;display:none}
.field.invalid input,.field.invalid select{border-color:var(--red)}
.field.invalid .err{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.82rem;color:var(--muted)}
/* Lists */
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.item .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .meta{font-size:.82rem;color:var(--muted);margin-top:3px}
.tag{font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 8px;text-transform:uppercase;letter-spacing:.3px}
.tag-paid{background:var(--green-soft);color:var(--green)}
.tag-unpaid{background:var(--red-soft);color:var(--red)}
.tag-overdue{background:var(--red);color:#fff}
.tag-info{background:var(--blue-soft);color:var(--blue)}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:44px;min-height:44px;
  font-size:1.05rem;cursor:pointer}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-top:6px}
/* Checklists */
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:26px;height:26px;min-width:26px;margin-top:2px;accent-color:var(--green)}
.chk.done .txt{color:var(--muted);text-decoration:line-through}
/* Bar chart */
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}
.bar-lbl{width:96px;flex-shrink:0;color:var(--muted)}
.bar-track{flex:1;background:#F1E8D8;border-radius:6px;height:18px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:6px;min-width:2px}
.bar-val{width:74px;text-align:right;font-weight:700;font-size:.85rem}
/* Disclaimer */
.disclaimer{background:#FFF8E6;border:1px solid #EAD98B;border-radius:12px;padding:12px;
  font-size:.85rem;margin:14px 0;color:#6B5B1E}
/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:60;padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:none;padding:9px 2px 7px;font-size:.62rem;color:var(--muted);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;font-weight:700}
.nav button .ic{font-size:1.25rem}
.nav button.active{color:var(--accent-dark)}
.nav button.active .ic{transform:scale(1.15)}
/* Empty state */
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:.95rem}
/* Print */
@media print{
  .nav,.app-head,.no-print{display:none!important}
  body{padding-bottom:0;background:#fff}
  .wrap{max-width:100%}
  .card,.item{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<header class="app-head no-print">
  <div class="wrap">
    <h1 id="headName">🍽️ Restaurant Ops Hub</h1>
    <div class="sub" id="headDate"></div>
  </div>
</header>

<main class="wrap">
  <section class="tab" id="tab-home"><h2>Home</h2><div id="view-home"></div></section>
  <section class="tab" id="tab-schedule"><h2>Schedule</h2><div id="view-schedule"></div></section>
  <section class="tab" id="tab-clock"><h2>Time Clock</h2><div id="view-clock"></div></section>
  <section class="tab" id="tab-payroll"><h2>Payroll</h2><div id="view-payroll"></div></section>
  <section class="tab" id="tab-moneyin"><h2>Money In</h2><div id="view-moneyin"></div></section>
  <section class="tab" id="tab-moneyout"><h2>Money Out</h2><div id="view-moneyout"></div></section>
  <section class="tab" id="tab-tasks"><h2>Tasks</h2><div id="view-tasks"></div></section>
  <section class="tab" id="tab-staff"><h2>Staff</h2><div id="view-staff"></div></section>
  <section class="tab" id="tab-reports"><h2>Reports</h2><div id="view-reports"></div></section>
  <section class="tab" id="tab-settings"><h2>Settings</h2><div id="view-settings"></div></section>
</main>

<nav class="nav no-print" id="bottomNav" aria-label="Main navigation"></nav>

<script>
"use strict";
/* ================================================================================
   Restaurant Ops Hub — free single-file back-office for one restaurant (Ontario).
   No network calls at runtime. All data lives in browser localStorage ("roh-v1").
   ================================================================================ */

/* ---------------- 1. CONSTANTS ---------------- */
const DB_KEY = "roh-v1";            // localStorage namespace for all app data
const DISCLAIMER = "Estimates only — not tax, legal, or accounting advice. Confirm with your accountant.";

// 2026 Canadian payroll figures (CRA). These change every January — update yearly!
const TAX = {
  cppRate: 0.0595, cppYmpe: 74600, cppExempt: 3500,   // CPP, employee share
  eiRate: 0.0163, eiMie: 68900,                       // EI, employee share
  // [upper bound of bracket, rate] — federal, 2026
  fedBrackets: [[58523,0.14],[117045,0.205],[181440,0.26],[258482,0.29],[Infinity,0.33]],
  fedBPA: 16452,                                       // federal basic personal amount
  // Ontario, 2026 (surtax ignored — estimates only)
  onBrackets: [[53891,0.0505],[107785,0.0915],[150000,0.1116],[220000,0.1216],[Infinity,0.1316]],
  onBPA: 12989                                        // Ontario basic personal amount
};
const PAY_PERIODS = { weekly: 52, biweekly: 26, monthly: 12 };
const EXPENSE_CATS = ["Food","Labour","Rent","Utilities","Supplies","Other"];

/* ---------------- 2. SMALL UTILITIES ---------------- */
// Escape user text before injecting into HTML (prevents HTML/JS injection)
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
// JSON object embedded in a single-quoted HTML attribute: escape apostrophes only
// (double quotes are legal inside single-quoted attributes and JSON needs them).
function attrJSON(o){ return JSON.stringify(o).replace(/'/g,"&#39;"); }
function uid(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function money(n){ const v=Number(n)||0; return "$"+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
// Validate a numeric field: returns number, or null if blank/invalid. min = lowest allowed.
function num(v, min){
  if(v==null) return null;
  const s = String(v).trim().replace(/[$,]/g,"");
  if(s==="") return null;
  const n = Number(s);
  if(!isFinite(n)) return null;
  if(min!=null && n<min) return null;
  return n;
}
// --- date helpers (all local time, ISO "YYYY-MM-DD") ---
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayISO(){ return isoOf(new Date()); }
function addDaysISO(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoOf(d); }
function parseISO(s){ const p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function mondayISO(s){ const d=parseISO(s); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return isoOf(d); }
function fmtDate(s){ return parseISO(s).toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"}); }
function fmtDateTime(isoStr){
  const d=new Date(isoStr);
  return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"})+" "+
         d.toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"});
}
function hoursBetween(inISO,outISO){ return (new Date(outISO)-new Date(inISO))/3600000; }

/* ---------------- 3. STORE (localStorage) ---------------- */
function blankDB(){
  return { v:1, seeded:false, seedIds:[],
    settings:{ restaurantName:"", province:"Ontario", hstRate:13 },
    staff:[], shifts:[], clock:[], payRuns:[],
    sales:[], invoices:[], expenses:[], bills:[], checklists:[] };
}
let DB = blankDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d && d.v===1 && Array.isArray(d.staff)) DB = Object.assign(blankDB(), d);
  }catch(e){ console.warn("Could not load saved data:", e); }
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ alert("Could not save — storage may be full (large receipt photos are the usual cause). Try deleting old receipt photos."); }
}
function staffById(id){ return DB.staff.find(s=>s.id===id); }
function staffName(id){ const s=staffById(id); return s? s.name : "(removed staff)"; }

/* ---------------- 4. SAMPLE DATA ---------------- */
function seedSampleData(){
  if(DB.seeded && DB.seedIds.length){ alert("Sample data is already loaded."); return; }
  const ids=[]; const keep=(o)=>{ids.push(o.id);return o;};
  const T = todayISO(), mon = mondayISO(T);
  // --- 6 staff ---
  const staffSeed=[
    ["Priya Sharma","Owner","416-555-0101",30.00,"2024-03-01",""],
    ["Marco Rossi","Cook","416-555-0102",22.50,"2024-06-15","Strong on grill station."],
    ["Aisha Khan","Server","416-555-0103",17.60,"2025-01-10",""],
    ["Diego Torres","Dishwasher","416-555-0104",17.60,"2025-05-20","Prefers evening shifts."],
    ["Lily Chen","Server","416-555-0105",17.60,"2025-09-01","In training on wine list."],
    ["Sam Patel","Prep Cook","416-555-0106",19.00,"2026-02-14",""]
  ];
  const S={};
  staffSeed.forEach(a=>{ const s=keep({id:uid(),name:a[0],role:a[1],phone:a[2],wage:a[3],hireDate:a[4],notes:a[5]});
    DB.staff.push(s); S[a[0]]=s.id; });
  // --- one week of shifts (Mon..Sun of current week) ---
  const W=[ // [dayOffset, staffKey, start, end, role]
    [0,"Marco Rossi","10:00","18:00","Cook"],[0,"Aisha Khan","11:00","19:00","Server"],
    [1,"Marco Rossi","10:00","18:00","Cook"],[1,"Lily Chen","11:00","19:00","Server"],
    [2,"Sam Patel","09:00","17:00","Prep"],[2,"Aisha Khan","11:00","19:00","Server"],[2,"Diego Torres","16:00","22:00","Dish"],
    [3,"Marco Rossi","10:00","18:00","Cook"],[3,"Lily Chen","11:00","19:00","Server"],[3,"Diego Torres","16:00","22:00","Dish"],
    [4,"Sam Patel","09:00","17:00","Prep"],[4,"Marco Rossi","12:00","21:00","Cook"],
    [4,"Aisha Khan","12:00","21:00","Server"],[4,"Lily Chen","17:00","23:00","Server"],[4,"Diego Torres","16:00","23:00","Dish"],
    [5,"Marco Rossi","10:00","20:00","Cook"],[5,"Aisha Khan","10:00","20:00","Server"],
    [5,"Lily Chen","12:00","22:00","Server"],[5,"Diego Torres","12:00","22:00","Dish"],[5,"Sam Patel","09:00","15:00","Prep"],
    [6,"Lily Chen","11:00","18:00","Server"],[6,"Diego Torres","11:00","18:00","Dish"],[6,"Marco Rossi","11:00","19:00","Cook"]
  ];
  W.forEach(w=>{ DB.shifts.push(keep({id:uid(),staffId:S[w[1]],date:addDaysISO(mon,w[0]),start:w[2],end:w[3],role:w[4]})); });
  // --- clock entries: past 5 days (matching the shifts above) ---
  const pastShifts = DB.shifts.filter(sh=>sh.date<T).slice(-14);
  pastShifts.forEach(sh=>{
    DB.clock.push(keep({id:uid(),staffId:sh.staffId,in:sh.date+"T"+sh.start+":00",out:sh.date+"T"+sh.end+":00"}));
  });
  // --- sales: last 7 days ---
  const salesSeed=[ // [daysAgo, dinein, takeout, delivery, catering]
    [6,1240.50,320.00,210.75,0],[5,1380.00,410.25,260.00,0],[4,1150.75,290.50,190.25,0],
    [3,1290.00,350.00,230.50,450.00],[2,1520.25,480.75,310.00,0],[1,1680.50,520.00,340.25,0],[0,1420.00,390.00,275.50,0]
  ];
  salesSeed.forEach(a=>{ DB.sales.push(keep({id:uid(),date:addDaysISO(T,-a[0]),dinein:a[1],takeout:a[2],delivery:a[3],catering:a[4]})); });
  // --- expenses ---
  const expSeed=[ // [daysAgo, category, amount, hst, note]
    [2,"Food",486.20,63.21,"Sysco order"],[3,"Food",212.45,27.62,"Produce market"],
    [5,"Utilities",188.10,24.45,"Hydro"],[8,"Rent",3200.00,0,"October rent"],
    [1,"Supplies",96.40,12.53,"Cleaning supplies"],[4,"Supplies",143.00,18.59,"Napkins & takeout boxes"],
    [6,"Other",320.00,41.60,"Walk-in cooler repair"]
  ];
  expSeed.forEach(a=>{ DB.expenses.push(keep({id:uid(),date:addDaysISO(T,-a[0]),category:a[1],amount:a[2],hst:a[3],note:a[4],receipt:null})); });
  // --- supplier bills ---
  const billSeed=[ // [daysFromNow(+/-), supplier, amount, paid, note]
    [3,"Gordon Food Service",742.18,false,"Weekly delivery"],
    [-1,"Toronto Hydro",211.40,false,"September bill"],
    [10,"Linen Service Co.",180.00,false,"Monthly linen"],
    [-20,"Sysco",486.20,true,"Paid Sep 10"]
  ];
  billSeed.forEach(a=>{ DB.bills.push(keep({id:uid(),supplier:a[1],amount:a[2],dueDate:addDaysISO(T,a[0]),paid:a[3],note:a[4]})); });
  // --- checklists ---
  const mkItems=(texts)=>texts.map(t=>({id:uid(),text:t,doneDate:null}));
  const cl1=keep({id:uid(),name:"Opening Checklist",daily:true,items:mkItems([
    "Unlock doors & disarm alarm","Turn on ovens, grills & fryers","Count the float in the till",
    "Restock napkins, cutlery & menus","Check today's reservations & prep list"])});
  const cl2=keep({id:uid(),name:"Closing Checklist",daily:true,items:mkItems([
    "Cash out & count the till","Clean grills, fryers & flat top","Mop floors & take out garbage",
    "Lock up & set the alarm","Log waste & leftovers"])});
  const cl3=keep({id:uid(),name:"Weekend Deep Clean",daily:false,items:mkItems([
    "Descale the coffee machine","Clean hood filters","Defrost & wipe chest freezer"])});
  cl1.items.forEach(i=>ids.push(i.id)); cl2.items.forEach(i=>ids.push(i.id)); cl3.items.forEach(i=>ids.push(i.id));
  DB.checklists.push(cl1,cl2,cl3);
  // --- one sample invoice ---
  DB.invoices.push(keep({id:uid(),client:"Maplewood Dental — staff lunch",dueDate:addDaysISO(T,7),paid:false,
    createdAt:T, items:[{desc:"Catering — 25 lunches",amount:625.00},{desc:"Delivery & setup",amount:45.00}]}));
  DB.seeded=true; DB.seedIds=ids; saveDB();
}
function clearSampleData(){
  if(!DB.seedIds.length){ alert("No sample data to clear."); return; }
  if(!confirm("Remove all sample data? Anything you added yourself stays.")) return;
  const gone=new Set(DB.seedIds);
  ["staff","shifts","clock","sales","invoices","expenses","bills","checklists"].forEach(k=>{
    DB[k]=DB[k].filter(o=>!gone.has(o.id));
  });
  DB.checklists.forEach(cl=>{ cl.items=cl.items.filter(i=>!gone.has(i.id)); });
  DB.seeded=false; DB.seedIds=[]; saveDB();
  alert("Sample data cleared — you're starting fresh.");
}

/* ---------------- 5. NAVIGATION ---------------- */
const TABS=[
  ["home","🏠","Home"],["schedule","📅","Schedule"],["clock","⏱️","Clock"],
  ["payroll","💵","Payroll"],["moneyin","📈","Money In"],["moneyout","📉","Money Out"],
  ["tasks","✅","Tasks"],["staff","👥","Staff"],["reports","📊","Reports"],["settings","⚙️","Settings"]
];
let currentTab="home";
function buildNav(){
  document.getElementById("bottomNav").innerHTML = TABS.map(t=>
    '<button data-tab="'+t[0]+'" class="'+(t[0]===currentTab?"active":"")+'">'+
    '<span class="ic">'+t[1]+'</span><span>'+t[2]+'</span></button>').join("");
  document.querySelectorAll("#bottomNav button").forEach(b=>{
    b.addEventListener("click",()=>showTab(b.getAttribute("data-tab")));
  });
}
function showTab(name){
  currentTab=name;
  document.querySelectorAll(".tab").forEach(s=>s.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  document.querySelectorAll("#bottomNav button").forEach(b=>
    b.classList.toggle("active", b.getAttribute("data-tab")===name));
  window.scrollTo(0,0);
  RENDER[name]();
}
// Shift helpers
function shiftsOn(dateISO){ return DB.shifts.filter(s=>s.date===dateISO)
  .sort((a,b)=>a.start.localeCompare(b.start)); }
// Clock helpers — hours per staff inside an inclusive date range
function hoursInRange(fromISO,toISO){
  const h={};
  DB.clock.forEach(e=>{
    if(!e.out) return;
    const d=e.in.slice(0,10);
    if(d>=fromISO && d<=toISO){ h[e.staffId]=(h[e.staffId]||0)+hoursBetween(e.in,e.out); }
  });
  return h;
}
function weekRange(refISO){ const m=mondayISO(refISO); return [m, addDaysISO(m,6)]; }

/* ---------------- 6. HOME DASHBOARD ---------------- */
function renderHome(){
  const t=todayISO(), [w0,w1]=weekRange(t);
  const onToday=shiftsOn(t);
  const openTasks=DB.checklists.reduce((n,cl)=>n+cl.items.filter(i=>!(i.doneDate===t)).length,0);
  const unpaid=DB.bills.filter(b=>!b.paid);
  const owing=unpaid.reduce((n,b)=>n+b.amount,0);
  const weekSales=DB.sales.filter(s=>s.date>=w0&&s.date<=w1)
    .reduce((n,s)=>n+s.dinein+s.takeout+s.delivery+s.catering,0);
  const hrs=hoursInRange(w0,w1);
  const labour=Object.keys(hrs).reduce((n,id)=>{const s=staffById(id);return n+(s?hrs[id]*s.wage:0);},0);
  const name=DB.settings.restaurantName||"your restaurant";
  document.getElementById("view-home").innerHTML =
    '<div class="card"><h3>Today — '+fmtDate(t)+'</h3>'+
    '<p class="hint" style="margin-top:0">Welcome back! Here\'s '+esc(name)+' at a glance.</p>'+
    '<div class="stat-grid">'+
      stat("👥 On shift today", onToday.length, onToday.map(s=>esc(staffName(s.staffId))).join(", ")||"Nobody scheduled")+
      stat("✅ Open tasks", openTasks, "across all checklists")+
      stat("🧾 Bills to pay", unpaid.length, money(owing)+" owing")+
      stat("💰 Sales this week", money(weekSales), fmtDate(w0)+" – "+fmtDate(w1))+
      stat("⏱️ Labour cost (week)", money(labour), "from time clock")+
      stat("📊 Net estimate (week)", money(weekSales-labour-expenseTotal(w0,w1)), "sales − labour − expenses")+
    '</div></div>'+

/* ---------------- 9. PAYROLL (ESTIMATES ONLY) ---------------- */
function bracketTax(annual, brackets){
  let tax=0, prev=0;
  for(const [cap,rate] of brackets){
    if(annual<=prev) break;
    tax += (Math.min(annual,cap)-prev)*rate; prev=cap;
  }
  return tax;
}
// Simplified Ontario payroll ESTIMATE for one pay period. Not CRA-accurate to the penny.
function payrollEstimate(gross, periodType){
  const n=PAY_PERIODS[periodType]||52;
  const cppCap=TAX.cppYmpe/n, cppEx=TAX.cppExempt/n;
  const cpp=Math.max(0, Math.min(gross,cppCap)-cppEx)*TAX.cppRate;
  const ei=Math.min(gross, TAX.eiMie/n)*TAX.eiRate;
  const annual=gross*n;
  const fed=Math.max(0, bracketTax(annual,TAX.fedBrackets)-TAX.fedBPA*0.14)/n;
  const ont=Math.max(0, bracketTax(annual,TAX.onBrackets)-TAX.onBPA*0.0505)/n;
  const total=cpp+ei+fed+ont;
  return {gross,cpp,ei,fedTax:fed,onTax:ont,total,net:gross-total};
}

// Downscale/compress a receipt photo before storing (keeps localStorage small)
function handleReceipt(ev){
  const f=ev.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=function(){
    try{
      const MAX=700, scale=Math.min(1, MAX/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      pendingReceipt=c.toDataURL("image/jpeg",0.65);
      document.getElementById("exPrev").innerHTML='<img class="thumb" src="'+pendingReceipt+'" alt="receipt preview">';
      URL.revokeObjectURL(img.src);
    }catch(e){ alert("Could not process that photo."); }
  };
  img.onerror=function(){ alert("Could not read that photo."); };
  img.src=URL.createObjectURL(f);
}

/* ---------------- 14. REPORTS ---------------- */
let repFrom=null, repTo=null;
function reportPreset(p){
  const t=todayISO();
  if(p==="week"){ const m=mondayISO(t); repFrom=m; repTo=addDaysISO(m,6); }
  else if(p==="lastweek"){ const m=addDaysISO(mondayISO(t),-7); repFrom=m; repTo=addDaysISO(m,6); }
  else if(p==="month"){ repFrom=t.slice(0,7)+"-01"; repTo=t; }
  else if(p==="lastmonth"){ const d=parseISO(t); d.setDate(1); d.setMonth(d.getMonth()-1);
    repFrom=isoOf(d); const e=new Date(d.getFullYear(),d.getMonth()+1,0); repTo=isoOf(e); }
  renderReports();
}
function renderReports(){
  if(!repFrom){ reportPresetSilent("month"); }
  const sales=DB.sales.filter(s=>s.date>=repFrom&&s.date<=repTo)
    .reduce((n,s)=>n+s.dinein+s.takeout+s.delivery+s.catering,0);
  const exps=DB.expenses.filter(e=>e.date>=repFrom&&e.date<=repTo);
  const expT=exps.reduce((n,e)=>n+e.amount,0);
  const hrs=hoursInRange(repFrom,repTo);
  const labour=Object.keys(hrs).reduce((n,id)=>{const s=staffById(id);return n+(s?hrs[id]*s.wage:0);},0);
  const labourPct=sales>0? (labour/sales*100):0;
  const net=sales-expT-labour;
  const byCat=EXPENSE_CATS.map(c=>({c,t:exps.filter(e=>e.category===c).reduce((n,e)=>n+e.amount,0)}))
    .filter(x=>x.t>0).sort((a,b)=>b.t-a.t);
  const maxCat=byCat.length?byCat[0].t:1;
  let h='<div class="card no-print"><h3>Period</h3><div class="btn-row">'+
    '<button class="btn btn-ghost" onclick="reportPreset(\'week\')">This week</button>'+
    '<button class="btn btn-ghost" onclick="reportPreset(\'lastweek\')">Last week</button>'+
    '<button class="btn btn-ghost" onclick="reportPreset(\'month\')">This month</button>'+
    '<button class="btn btn-ghost" onclick="reportPreset(\'lastmonth\')">Last month</button></div>'+
    '<p class="hint">'+fmtDate(repFrom)+' – '+fmtDate(repTo)+'</p></div>';
  h+='<div class="card"><h3>Summary</h3>'+
    '<div class="kv"><span class="k">Total sales</span><span class="v">'+money(sales)+'</span></div>'+
    '<div class="kv"><span class="k">Total expenses</span><span class="v">'+money(expT)+'</span></div>'+
    '<div class="kv"><span class="k">Labour cost <span class="hint">(time clock × wages)</span></span><span class="v">'+money(labour)+'</span></div>'+
    '<div class="kv"><span class="k">Labour as % of sales</span><span class="v">'+labourPct.toFixed(1)+'%</span></div>'+
    '<div class="kv"><span class="k"><b>Net estimate</b></span><span class="v big">'+money(net)+'</span></div></div>';
  h+='<div class="card"><h3>Expenses by category</h3>';
  h+= byCat.length? byCat.map(x=>'<div class="bar-row"><div class="bar-lbl">'+esc(x.c)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,Math.round(x.t/maxCat*100))+'%"></div></div>'+
      '<div class="bar-val">'+money(x.t)+'</div></div>').join("")
      : '<p class="hint">No expenses in this period.</p>';
  h+='</div>';
  h+='<div class="card"><h3>Sales channels</h3>';
  const ch={dinein:0,takeout:0,delivery:0,catering:0};
  DB.sales.filter(s=>s.date>=repFrom&&s.date<=repTo).forEach(s=>{ch.dinein+=s.dinein;ch.takeout+=s.takeout;ch.delivery+=s.delivery;ch.catering+=s.catering;});
  const maxCh=Math.max(1,ch.dinein,ch.takeout,ch.delivery,ch.catering);
  h+= ["dinein","takeout","delivery","catering"].map(k=>'<div class="bar-row"><div class="bar-lbl">'+k[0].toUpperCase()+k.slice(1)+
      '</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,Math.round(ch[k]/maxCh*100))+'%;background:var(--green)"></div></div>'+
      '<div class="bar-val">'+money(ch[k])+'</div></div>').join("");
  h+='</div>';
  h+='<div class="disclaimer">'+esc(DISCLAIMER)+'</div>';
  h+='<div class="no-print"><button class="btn btn-blue" onclick="window.print()">🖨️ Print report</button></div>';
  document.getElementById("view-reports").innerHTML=h;
}
function reportPresetSilent(p){
  const t=todayISO();
  if(p==="month"){ repFrom=t.slice(0,7)+"-01"; repTo=t; }
}

  a.download="restaurant-ops-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      if(!d||d.v!==1||!Array.isArray(d.staff)||!Array.isArray(d.shifts)) throw new Error("bad file");
      if(!confirm("Replace ALL current data with this backup?")) return;
      DB=Object.assign(blankDB(),d); saveDB(); updateHead(); showTab("home");
      alert("Backup imported.");
    }catch(e){ alert("That file doesn't look like a Restaurant Ops Hub backup."); }
  };
  r.readAsText(f); ev.target.value="";
}
function eraseAll(){
  if(!confirm("ERASE EVERYTHING on this device? This cannot be undone.")) return;
  if(!confirm("Last chance — really delete all data?")) return;
  localStorage.removeItem(DB_KEY);
  DB=blankDB(); saveDB();
  payCtx={staffId:null,periodType:"weekly",periodStart:null,hours:null};
  repFrom=null; repTo=null; schedOffset=0; shiftDraft=null; staffDraft=null;
  updateHead(); showTab("settings");
}
function updateHead(){
  const n=DB.settings.restaurantName;
  document.getElementById("headName").textContent="🍽️ "+(n||"Restaurant Ops Hub");
  document.getElementById("headDate").textContent=new Date().toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}

/* ---------------- 16. INIT ---------------- */
const RENDER={home:renderHome,schedule:renderSchedule,clock:renderClock,payroll:renderPayroll,
  moneyin:renderMoneyIn,moneyout:renderMoneyOut,tasks:renderTasks,staff:renderStaff,
  reports:renderReports,settings:renderSettings};
document.addEventListener("DOMContentLoaded",function(){
  loadDB();
  if(!localStorage.getItem(DB_KEY)){ seedSampleData(); } // first run: load sample data
  buildNav(); updateHead(); showTab("home");
});
</script>
