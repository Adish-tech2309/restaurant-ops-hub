<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant Ops Hub</title>
<script>try{var __t=localStorage.getItem("roh-theme");if(__t!=="dark"&&__t!=="light"){__t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",__t);}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<style>
/* ============ Restaurant Ops Hub — professional design system (offline, no external assets) ============ */
:root{
  color-scheme:light;
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#f7f9fa; --input-bg:#ffffff;
  --ink:#1b2431; --muted:#68727f; --faint:#98a1ad; --label-ink:#39434f; --pill-ink:#4a5568;
  --line:#e0e5ea; --line-soft:#edf0f4; --track:#e8ecf0; --input-border:#ccd3db;
  --ghost-border:#cfd6de; --ghost-border-hover:#a9b4c0; --red-line:#eec2bb;
  --overdue-bg:#fdf4f3; --card-hi:#fffdf7;
  --accent:#166b4d; --accent-hover:#0e5039; --accent-ink:#166b4d; --accent-deep:#0e5039; --accent-soft:#e1efe7;
  --red:#b3372c; --red-hover:#8c2a21; --red-ink:#b3372c; --red-deep:#8c2a21; --red-soft:#f9e9e6;
  --amber:#8a5f0e; --amber-ink:#8a5f0e; --amber-text:#6b5110; --amber-soft:#faf3dd; --amber-line:#e9d48f;
  --blue:#2f5d86; --blue-hover:#234a6d; --blue-ink:#2f5d86; --blue-deep:#234a6d; --blue-soft:#e8f0f8;
  --tip-bg:#1c2536; --tip-ink:#ffffff;
  --side:#141b29; --side-ink:#b9c2d2; --side-dim:#7e8899;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06);
  --sidebar-w:250px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1320; --surface:#17202f; --surface-2:#1d2740; --input-bg:#121a2a;
  --ink:#e9edf3; --muted:#9aa5b5; --faint:#7d8899; --label-ink:#c9d1dd; --pill-ink:#b9c2d2;
  --line:#27334b; --line-soft:#1f2a40; --track:#27334b; --input-border:#35435f;
  --ghost-border:#35435f; --ghost-border-hover:#4c5d7e; --red-line:#5a322c;
  --overdue-bg:#2e201d; --card-hi:#1a2438;
  --accent:#166b4d; --accent-hover:#1e8a5f; --accent-ink:#5cb98c; --accent-deep:#8fd6b2; --accent-soft:#14362b;
  --red:#b3372c; --red-hover:#c14a3c; --red-ink:#e58a7d; --red-deep:#f0a89e; --red-soft:#38211e;
  --amber:#c9a227; --amber-ink:#d9b64a; --amber-text:#dcc078; --amber-soft:#2c2515; --amber-line:#5c4d1f;
  --blue:#2f5d86; --blue-hover:#3a6f9e; --blue-ink:#7fb0d8; --blue-deep:#a9cbe8; --blue-soft:#1b2a40;
  --tip-bg:#e9edf3; --tip-ink:#141b29;
  --side:#141b29; --side-ink:#b9c2d2; --side-dim:#7e8899;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;padding-bottom:172px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- inline SVG icons ---- */
.svgic{display:inline-flex;flex-shrink:0;vertical-align:-.16em}
.svgic svg{width:1.05em;height:1.05em;display:block}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  border-radius:8px;background:var(--accent);color:#fff;flex-shrink:0}
.brand-mark .svgic{font-size:19px}
/* ---- header ---- */
.app-head{background:var(--side);color:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid #0b1120}
.head-inner{max-width:720px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:11px}
.app-head h1{font-size:1.02rem;margin:0;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-width:0}
.app-head h1 span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-head .sub{font-size:.74rem;color:var(--side-ink);margin-left:auto;white-space:nowrap}
/* ---- tabs ---- */
.tab{display:none}
.tab.active{display:block;animation:tabIn .2s ease-out}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tab.active .card{animation:cardIn .24s cubic-bezier(.22,.68,.32,1) both}
.tab h2{font-size:1.38rem;font-weight:700;letter-spacing:-.02em;margin:20px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:1rem;font-weight:650;letter-spacing:-.01em}
.card h3 .svgic{color:var(--accent-ink);margin-right:7px;font-size:1.05em}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h3{margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:.93rem}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:1.55rem;font-weight:750;letter-spacing:-.02em}
/* ---- KPI stats ---- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.stat .lbl{display:flex;align-items:center;gap:7px;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .lbl .svgic{color:var(--accent-ink);font-size:.95rem}
.stat .num{font-size:1.5rem;font-weight:750;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .det{font-size:.78rem;color:var(--muted);margin-top:3px;line-height:1.4}
/* ---- pills & tags ---- */
.pill{display:inline-flex;align-items:center;background:var(--surface-2);color:var(--pill-ink);
  border-radius:999px;padding:2px 10px;font-size:.7rem;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.pill-accent{background:var(--accent-soft);color:var(--accent-deep)}
.tag{display:inline-flex;align-items:center;font-size:.68rem;font-weight:700;border-radius:6px;padding:3px 9px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag-paid{background:var(--accent-soft);color:var(--accent-deep)}
.tag-unpaid{background:var(--surface-2);color:var(--pill-ink)}
.tag-overdue{background:var(--red);color:#fff}
.tag-info{background:var(--blue-soft);color:var(--blue-deep)}
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:9px;
  padding:12px 18px;font-size:.94rem;font-weight:650;cursor:pointer;min-height:48px;text-align:center;text-decoration:none;
  font-family:inherit;transition:background .12s ease,border-color .12s ease}
.btn:active{transform:translateY(1px)}
.btn .svgic{font-size:1.02rem}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:hover{background:var(--accent-hover)}
.btn-green{background:var(--accent);color:#fff}
.btn-green:hover{background:var(--accent-hover)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-hover)}
.btn-ghost{background:var(--surface);border-color:var(--ghost-border);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ghost-border-hover);background:var(--surface-2)}
.btn-danger{background:var(--red-soft);color:var(--red-deep);border-color:var(--red-line)}
.btn-danger:hover{background:#f6ddd8}
.btn-danger-solid{background:var(--red);color:#fff;width:100%}
.btn-danger-solid:hover{background:var(--red-hover)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn-row .btn{flex:1;min-width:120px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ghost-border);background:var(--surface);
  border-radius:8px;min-width:44px;min-height:44px;cursor:pointer;color:var(--label-ink);font-size:1rem}
.icon-btn:hover{border-color:var(--ghost-border-hover);background:var(--surface-2)}
.icon-btn.danger{color:var(--red-ink)}
.icon-btn.danger:hover{background:var(--red-soft);border-color:var(--red-line)}
/* ---- forms ---- */
.field{margin:0 0 12px}
.field label{display:block;font-weight:600;font-size:.84rem;margin-bottom:6px;color:var(--label-ink)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--input-border);
  border-radius:8px;font-size:1rem;background:var(--input-bg);color:var(--ink);min-height:48px;font-family:inherit}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px rgba(22,107,77,.14)}
.field .err{color:var(--red-ink);font-size:.8rem;margin-top:4px;display:none}
.field.invalid input,.field.invalid select{border-color:var(--red-ink)}
.field.invalid input:focus,.field.invalid select:focus{box-shadow:0 0 0 3px rgba(179,55,44,.14)}
.field.invalid .err{display:flex;align-items:center;gap:7px;font-weight:600}
.field.invalid .err::before{content:"!";display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0;
  border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.8rem;color:var(--muted)}
.notes-line{display:flex;gap:8px;align-items:flex-start}
.notes-line .svgic{color:var(--faint);margin-top:2px}
/* ---- lists ---- */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.item .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item .meta{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.55}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-top:8px}
/* ---- data tables ---- */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:540px}
.tbl thead th{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  text-align:left;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface);
  position:sticky;top:0;z-index:2}
.tbl tbody td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl-wrap.tall{max-height:62vh;overflow-y:auto}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .th-act,.tbl .td-act{text-align:right;white-space:nowrap;width:1%}
.tbl .meta{font-size:.78rem;color:var(--muted);margin-top:2px}
.row-overdue td{background:var(--overdue-bg)}
/* ---- checklists ---- */
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:.94rem}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:22px;height:22px;min-width:22px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.chk.done .txt{color:var(--faint);text-decoration:line-through}
.chk .txt{flex:1}
/* ---- bar charts ---- */
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:.88rem}
.bar-lbl{width:104px;flex-shrink:0;color:var(--muted);font-size:.8rem}
.bar-track{flex:1;background:var(--track);border-radius:999px;height:10px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent-ink);border-radius:999px;min-width:3px;
  transition:width .55s cubic-bezier(.22,.68,.32,1)}
.bar-val{width:86px;text-align:right;font-weight:650;font-size:.84rem;font-variant-numeric:tabular-nums}
/* ---- disclaimer ---- */
.disclaimer{background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:10px;padding:12px 14px;
  font-size:.84rem;margin:0 0 14px;color:var(--amber-text);display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.disclaimer .svgic{color:var(--amber-ink);font-size:1.05rem;margin-top:1px}
/* ---- navigation ---- */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:60;
  padding:6px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(16,24,40,.07)}
.nav button{border:0;background:none;padding:8px 2px 6px;font-size:.6rem;line-height:1.25;color:var(--muted);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;font-weight:650;font-family:inherit}
.nav .nav-ic{display:inline-flex}
.nav .nav-ic .svgic{font-size:22px}
.nav button.active{color:var(--accent-ink)}
.side-brand{display:none}
/* ---- empty states ---- */
.empty{text-align:center;color:var(--muted);padding:30px 14px;font-size:.93rem}
.empty-inline{padding:6px 2px;color:var(--muted);font-size:.88rem}
/* ---- desktop layout ---- */
@media(min-width:960px){
  body{padding-bottom:48px}
  .wrap{max-width:1140px;margin-left:var(--sidebar-w);padding:0 32px}
  .app-head{margin-left:var(--sidebar-w);background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
  .head-inner{max-width:1140px;padding:13px 32px}
  .app-head .brand-mark{display:none}
  .app-head .sub{color:var(--muted)}
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--sidebar-w);display:flex;flex-direction:column;align-items:stretch;
    background:var(--side);border-top:0;border-right:1px solid #0b1120;padding:22px 14px;gap:3px;overflow-y:auto;box-shadow:none}
  .side-brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;margin-bottom:12px;border-bottom:1px solid #232e45}
  .side-brand .brand-mark{width:36px;height:36px}
  .side-brand .brand-mark .svgic{font-size:21px}
  .side-brand-txt{display:flex;flex-direction:column;line-height:1.3}
  .side-brand-txt b{color:#fff;font-size:.93rem;font-weight:700;letter-spacing:-.01em}
  .side-brand-txt i{color:var(--side-dim);font-style:normal;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;font-size:.9rem;
    border-radius:8px;color:var(--side-ink);min-height:44px;width:100%;text-align:left}
  .nav .nav-ic .svgic{font-size:19px}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.active{background:var(--accent);color:#fff}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .tab h2{margin-top:26px}
}
/* ---- print ---- */
@media print{
  :root,[data-theme="dark"]{
    color-scheme:light;
    --bg:#fff; --surface:#fff; --surface-2:#f7f9fa; --input-bg:#fff;
    --ink:#1b2431; --muted:#68727f; --faint:#98a1ad; --label-ink:#39434f; --pill-ink:#4a5568;
    --line:#e0e5ea; --line-soft:#edf0f4; --track:#e8ecf0; --input-border:#ccd3db;
    --ghost-border:#cfd6de; --ghost-border-hover:#a9b4c0; --red-line:#eec2bb;
    --overdue-bg:#fdf4f3; --card-hi:#fffdf7;
    --accent:#166b4d; --accent-hover:#0e5039; --accent-ink:#166b4d; --accent-deep:#0e5039; --accent-soft:#e1efe7;
    --red:#b3372c; --red-hover:#8c2a21; --red-ink:#b3372c; --red-deep:#8c2a21; --red-soft:#f9e9e6;
    --amber:#8a5f0e; --amber-ink:#8a5f0e; --amber-text:#6b5110; --amber-soft:#faf3dd; --amber-line:#e9d48f;
    --blue:#2f5d86; --blue-hover:#234a6d; --blue-ink:#2f5d86; --blue-deep:#234a6d; --blue-soft:#e8f0f8;
    --tip-bg:#1c2536; --tip-ink:#fff;
    --shadow:none;
  }
  .nav,.app-head,.no-print,.toast-wrap,.modal-overlay,.chart-tip{display:none!important}
  body{padding-bottom:0;background:#fff}
  .wrap{max-width:100%;margin-left:0}
  .card,.item{box-shadow:none;break-inside:avoid}
  .tbl-wrap{overflow:visible;margin:0;padding:0}
  .tbl{min-width:0}
  .tbl tbody tr:hover{background:none}
  .tab.active .card{animation:none}
}

/* ---- theme toggle ---- */
.theme-btn{margin-left:10px;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;
  border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;flex-shrink:0}
.theme-btn:hover{background:rgba(255,255,255,.14)}
.theme-btn .svgic{font-size:18px}
@media(min-width:960px){
  .theme-btn{border-color:var(--line);background:var(--surface-2);color:var(--ink)}
  .theme-btn:hover{background:var(--line-soft)}
}
/* ---- toasts ---- */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:300;display:flex;
  flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:#1c2536;color:#fff;border-radius:10px;padding:12px 16px;
  font-size:.9rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);
  transition:opacity .22s ease-out,transform .22s ease-out;max-width:480px;pointer-events:auto;line-height:1.45}
.toast.show{opacity:1;transform:none}
.toast .svgic{font-size:1.15rem;flex-shrink:0}
.toast-success .svgic{color:#5fce96}
.toast-error .svgic{color:#f08a7d}
.toast-info .svgic{color:#8fb8dd}
/* ---- modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,32,.55);z-index:200;display:flex;align-items:center;
  justify-content:center;padding:20px;animation:tabIn .18s ease-out}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:400px;width:100%;
  padding:26px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:cardIn .22s cubic-bezier(.22,.68,.32,1)}
.modal-card h3{margin:0 0 8px;font-size:1.12rem;letter-spacing:-.01em}
.modal-card p{color:var(--muted);font-size:.92rem;margin:0 0 20px;line-height:1.55;white-space:pre-line}
.modal-ic{width:50px;height:50px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  display:inline-flex;align-items:center;justify-content:center;font-size:23px;margin-bottom:14px}
.modal-ic.danger{background:var(--red-soft);color:var(--red-deep)}
.modal-btns{display:flex;gap:10px}
.modal-btns .btn{width:auto;flex:1;min-height:48px}
/* ---- empty states ---- */
.empty-state{text-align:center;padding:38px 20px;max-width:430px;margin:0 auto}
.es-ic{width:58px;height:58px;border-radius:18px;background:var(--accent-soft);color:var(--accent-ink);
  display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
.es-head{font-weight:700;font-size:1.02rem;letter-spacing:-.01em}
.es-sub{color:var(--muted);font-size:.88rem;margin-top:6px;line-height:1.55}
.es-btn{width:auto;margin-top:16px;padding:11px 24px;min-height:46px}
.empty-inline2{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 10px;color:var(--muted);font-size:.88rem}
.empty-inline2 .svgic{color:var(--faint);font-size:1.2rem}
/* ---- sales trend chart ---- */
.chart-wrap{position:relative}
.sales-chart{width:100%;height:auto;display:block}
.ct-grid{stroke:var(--line-soft);stroke-width:1}
.ct-axlbl{fill:var(--faint);font-size:10px}
.ct-vallbl{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.ct-line{fill:none;stroke:var(--accent-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ct-area{fill:var(--accent-ink);opacity:.13}
.ct-avg{stroke:var(--faint);stroke-width:1.5;stroke-dasharray:5 4}
.ct-avglbl{fill:var(--faint);font-size:10px}

function ic(n){ return '<span class="svgic" aria-hidden="true">'+(ICONS[n]||"")+'</span>'; }

/* ============ 3b. THEME ============ */
const THEME_KEY="roh-theme";
function initTheme(){
  const b=document.getElementById("themeBtn");
  if(b) b.addEventListener("click",toggleTheme);
  updateThemeIcon();
}
function toggleTheme(){
  applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
  updateThemeIcon();
}
function updateThemeIcon(){
  const b=document.getElementById("themeBtn"); if(!b) return;
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  b.innerHTML=ic(dark?"sun":"moon");
  b.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
}

/* ============ 3c. TOASTS + MODAL ============ */
function raf(fn){ if(typeof requestAnimationFrame==="function") requestAnimationFrame(fn); else fn(); }
function toast(msg,type){
  type=(type==="success"||type==="error")?type:"info";
  const wrap=document.getElementById("toastWrap"); if(!wrap) return;
  const el=document.createElement("div");
  el.className="toast toast-"+type;
  el.setAttribute("role","status");
  el.innerHTML=ic(type==="success"?"checkcircle":type==="error"?"alert":"info")+"<span>"+esc(String(msg))+"</span>";
  wrap.appendChild(el);
  raf(function(){ el.classList.add("show"); });
  setTimeout(function(){ el.classList.remove("show"); setTimeout(function(){ el.remove(); },280); },3400);
  while(wrap.children&&wrap.children.length>3){ wrap.removeChild(wrap.firstChild); }
}
function confirmDialog(o){
  o=Object.assign({title:"Are you sure?",message:"",confirmLabel:"Confirm",cancelLabel:"Cancel",danger:false},o||{});
  return new Promise(function(resolve){
    const root=document.getElementById("modalRoot"); if(!root){ resolve(false); return; }
    root.innerHTML=
      '<div class="modal-overlay" id="mOverlay"><div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="mTitle">'+
      '<div class="modal-ic'+(o.danger?" danger":"")+'">'+ic(o.danger?"alert":"checksq")+'</div>'+
      '<h3 id="mTitle">'+esc(o.title)+'</h3>'+
      (o.message?'<p>'+esc(o.message).replace(/\n/g,"<br>")+'</p>':"")+
      '<div class="modal-btns"><button class="btn btn-ghost" id="mCancel">'+esc(o.cancelLabel)+'</button>'+
      '<button class="btn '+(o.danger?"btn-danger-solid":"btn-primary")+'" id="mOk">'+esc(o.confirmLabel)+'</button></div>'+
      '</div></div>';
    const btnCancel=document.getElementById("mCancel"), btnOk=document.getElementById("mOk");
    function close(v){ document.removeEventListener("keydown",onKey); root.innerHTML=""; resolve(v); }
    function onKey(e){
      if(e.key==="Escape"){ close(false); }
      else if(e.key==="Tab"&&btnCancel&&btnOk){
        if(e.shiftKey&&document.activeElement===btnCancel){ e.preventDefault(); btnOk.focus(); }
        else if(!e.shiftKey&&document.activeElement===btnOk){ e.preventDefault(); btnCancel.focus(); }
      }
    }
    document.addEventListener("keydown",onKey);
    document.getElementById("mOverlay").addEventListener("click",function(e){ if(e.target===this) close(false); });
    btnCancel.onclick=function(){ close(false); };
    btnOk.onclick=function(){ close(true); };
    btnCancel.focus();
  });
}

  return '<div class="empty-state"><div class="es-ic">'+ic(icon)+'</div>'+

    (btnLabel&&btnAction?'<button class="btn btn-primary es-btn" onclick="'+btnAction+'">'+esc(btnLabel)+'</button>':"")+
  '</div>';
}
function emptyInline(icon,text){
  return '<div class="empty-inline2">'+ic(icon)+'<span>'+esc(text)+'</span></div>';
}

/* ============ 3e. MOTION HELPERS ============ */
function reducedMotion(){
  return typeof window!=="undefined"&&window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function staggerCards(tabName){
  if(reducedMotion()) return;
  const cards=document.querySelectorAll("#tab-"+tabName+" .card");
  cards.forEach(function(c,i){ c.style.animationDelay=Math.min(i*45,270)+"ms"; });
}
function countUp(scope){
  if(!scope||!scope.querySelectorAll) return;
  const list=scope.querySelectorAll("[data-count]");
  list.forEach(function(el){
    const target=parseFloat(el.getAttribute("data-count"));
    const fmt=el.getAttribute("data-fmt");
    const render=function(v){ el.textContent=fmt==="money"?money(v):String(Math.round(v)); };
    if(!isFinite(target)){ render(0); return; }
    if(reducedMotion()||typeof requestAnimationFrame!=="function"){ render(target); return; }
    const dur=650,t0=performance.now();
    (function step(t){
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      render(target*e);
      if(p<1) requestAnimationFrame(step); else render(target);
    })(t0);
  });
}
function animateBars(scope){
  if(!scope||!scope.querySelectorAll||reducedMotion()) return;
  scope.querySelectorAll(".bar-fill").forEach(function(f){
    const w=f.style.width||"0%";
    f.style.width="0%";
    raf(function(){ raf(function(){ f.style.width=w; }); });
  });
}

/* ============ 3f. SALES TREND CHART ============ */
const CT={W:560,H:212,PL:48,PR:16,PT:22,PB:28};
let _trendData=[],_trendMax=1;
function salesSeries(days){
  const t=todayISO(),out=[];
  for(let i=days-1;i>=0;i--){
    const d=addDaysISO(t,-i);
    const s=DB.sales.find(function(x){return x.date===d;});
    out.push({date:d,total:s?((+s.dinein||0)+(+s.takeout||0)+(+s.delivery||0)+(+s.catering||0)):0});
  }
  return out;
}
function moneyShort(v){ v=Number(v)||0; if(v>=1000) return "$"+(v/1000).toFixed(1).replace(/\.0$/,"")+"k"; return "$"+Math.round(v); }
function renderSalesTrend(){
  _trendData=salesSeries(14);
  const data=_trendData,n=data.length;
  if(!data.some(function(d){return d.total>0;})){
    return emptyState("trendup","No sales data yet",
      "Log daily sales in the Money In tab and your 14-day trend will appear here.",
      "Log sales","showTab('moneyin')");
  }
  _trendMax=Math.max.apply(null,data.map(function(d){return d.total;}).concat([1]));
  const max=_trendMax;
  const iw=CT.W-CT.PL-CT.PR, ih=CT.H-CT.PT-CT.PB;
  const x=function(i){return CT.PL+iw*(i/(n-1));};
  const y=function(v){return CT.PT+ih*(1-v/max);};
  let grid="";
  for(let g=0;g<=3;g++){
    const gv=max*g/3, gy=y(gv).toFixed(1);
    grid+='<line class="ct-grid" x1="'+CT.PL+'" y1="'+gy+'" x2="'+(CT.W-CT.PR)+'" y2="'+gy+'"/>'+
      '<text class="ct-vallbl" x="'+(CT.PL-8)+'" y="'+(Number(gy)+3.5)+'" text-anchor="end">'+moneyShort(gv)+'</text>';
  }
  const pts=data.map(function(d,i){return [x(i),y(d.total)];});
  const line="M"+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" L");
  const area=line+" L"+x(n-1).toFixed(1)+","+(CT.H-CT.PB)+" L"+x(0).toFixed(1)+","+(CT.H-CT.PB)+" Z";
  let mi=0,ma=0;
  data.forEach(function(d,i){ if(d.total<data[mi].total) mi=i; if(d.total>data[ma].total) ma=i; });
  let mml="";
  if(mi===ma){
    mml='<text class="ct-mmlbl" x="'+x(mi).toFixed(1)+'" y="'+(y(data[mi].total)-10).toFixed(1)+'" text-anchor="middle">Steady '+moneyShort(data[mi].total)+'</text>';
  }else{
    const maAbove=y(data[ma].total)>=CT.PT+18;
    mml='<text class="ct-mmlbl" x="'+x(ma).toFixed(1)+'" y="'+(y(data[ma].total)+(maAbove?-10:18)).toFixed(1)+'" text-anchor="middle">High '+moneyShort(data[ma].total)+'</text>';
    const miAbove=y(data[mi].total)>CT.H-CT.PB-34;
    mml+='<text class="ct-mmlbl" x="'+x(mi).toFixed(1)+'" y="'+(y(data[mi].total)+(miAbove?-10:18)).toFixed(1)+'" text-anchor="middle">Low '+moneyShort(data[mi].total)+'</text>';
  }
  let xlbl="";
  data.forEach(function(d,i){
    if(i%2!==0) return;
    const lbl=parseISO(d.date).toLocaleDateString("en-CA",{month:"short",day:"numeric"});
    xlbl+='<text class="ct-axlbl" x="'+x(i).toFixed(1)+'" y="'+(CT.H-8)+'" text-anchor="middle">'+esc(lbl)+'</text>';
  });
  const avg=data.slice(-7).reduce(function(s,d){return s+d.total;},0)/7;
  const ay=y(avg).toFixed(1);
  const avgLine='<line class="ct-avg" x1="'+CT.PL+'" y1="'+ay+'" x2="'+(CT.W-CT.PR)+'" y2="'+ay+'"/>'+
    '<text class="ct-avglbl" x="'+(CT.W-CT.PR)+'" y="'+(Number(ay)-6)+'" text-anchor="end">7-day avg '+moneyShort(avg)+'</text>';
  const dots=pts.map(function(p){return '<circle class="ct-pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5"/>';}).join("");
  const tot14=data.reduce(function(s,d){return s+d.total;},0);
  const svg='<svg id="salesChart" class="sales-chart" viewBox="0 0 '+CT.W+' '+CT.H+'" role="img" aria-label="Daily sales for the last 14 days, total '+money(tot14)+'">'+
    grid+avgLine+'<path class="ct-area" d="'+area+'"/>'+
    '<path class="ct-line" pathLength="1" d="'+line+'"/>'+dots+mml+xlbl+
    '<rect class="ct-hit" x="'+CT.PL+'" y="'+CT.PT+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>';
  return '<div class="chart-wrap" id="trendWrap">'+svg+'<div class="chart-tip" id="chartTip" aria-hidden="true"></div></div>';
}
function bindChartTip(){
  const wrap=document.getElementById("trendWrap"), tip=document.getElementById("chartTip"), svg=document.getElementById("salesChart");
  if(!wrap||!tip||!svg||!_trendData.length) return;
  const n=_trendData.length, iw=CT.W-CT.PL-CT.PR, ih=CT.H-CT.PT-CT.PB;
  function show(ev){
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    const cx=(ev.clientX-r.left)/(r.width/CT.W);
    let i=Math.round(((cx-CT.PL)/iw)*(n-1)); i=Math.max(0,Math.min(n-1,i));
    const d=_trendData[i];
    const px=CT.PL+iw*(i/(n-1)), py=CT.PT+ih*(1-d.total/_trendMax);
    tip.innerHTML=esc(fmtDate(d.date))+'<span class="tt-sub">'+money(d.total)+'</span>';
    tip.style.left=(px/CT.W*100)+"%";
    tip.style.top=(py/CT.H*100)+"%";
    tip.style.opacity="1";
  }
  function hide(){ tip.style.opacity="0"; }
  svg.addEventListener("pointermove",show);
  svg.addEventListener("pointerleave",hide);
}

function money(n){ const v=Number(n)||0; return "$"+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
// Validate a numeric field: returns number, or null if blank/invalid. min = lowest allowed.
function num(v, min){
  if(v==null) return null;
  const s = String(v).trim().replace(/[$,]/g,"");
  if(s==="") return null;
  const n = Number(s);
  if(!isFinite(n)) return null;
  if(min!=null && n<min) return null;
  return n;
}
// --- date helpers (all local time, ISO "YYYY-MM-DD") ---
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayISO(){ return isoOf(new Date()); }
function addDaysISO(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoOf(d); }
function parseISO(s){ const p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function mondayISO(s){ const d=parseISO(s); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return isoOf(d); }
function fmtDate(s){ return parseISO(s).toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"}); }
function fmtDateTime(isoStr){
  const d=new Date(isoStr);
  return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"})+" "+
         d.toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"});
}
function hoursBetween(inISO,outISO){ return (new Date(outISO)-new Date(inISO))/3600000; }

// Shift helpers
function shiftsOn(dateISO){ return DB.shifts.filter(s=>s.date===dateISO)
  .sort((a,b)=>a.start.localeCompare(b.start)); }
// Clock helpers — hours per staff inside an inclusive date range
function hoursInRange(fromISO,toISO){
  const h={};
  DB.clock.forEach(e=>{
    if(!e.out) return;
    const d=e.in.slice(0,10);
    if(d>=fromISO && d<=toISO){ h[e.staffId]=(h[e.staffId]||0)+hoursBetween(e.in,e.out); }
  });
  return h;
}
function weekRange(refISO){ const m=mondayISO(refISO); return [m, addDaysISO(m,6)]; }

/* ---------------- 6. HOME DASHBOARD ---------------- */
function renderHome(){
  const t=todayISO(), [w0,w1]=weekRange(t);

  const unpaid=DB.bills.filter(b=>!b.paid);

      sh.map(s=>

      '<td><span class="pill">'+esc(s.role||"Shift")+'</span></td>'+

      '<button class="icon-btn danger" onclick="deleteShift(\''+s.id+'\')" aria-label="Delete shift" title="Delete">'+ic("trash")+'</button></td></tr>').join("")+

      '<div class="field"><label>Staff member</label><select id="sfStaff">'+
      DB.staff.map(s=>'<option value="'+s.id+'"'+(s.id===d.staffId?" selected":"")+'>'+esc(s.name)+'</option>').join("")+
      '</select></div>'+
      '<div class="grid2"><div class="field"><label>Date</label><input type="date" id="sfDate" value="'+esc(d.date)+'"></div>'+
      '<div class="field"><label>Role</label><input id="sfRole" value="'+esc(d.role||"")+'" placeholder="e.g. Server"></div></div>'+
      '<div class="grid2"><div class="field"><label>Start</label><input type="time" id="sfStart" value="'+esc(d.start)+'"></div>'+
      '<div class="field"><label>End</label><input type="time" id="sfEnd" value="'+esc(d.end)+'"></div></div>'+
      '<div class="btn-row"><button class="btn btn-primary" onclick="saveShift()">Save shift</button>'+
      '<button class="btn btn-ghost" onclick="shiftDraft=null;renderSchedule()">Cancel</button></div></div>';
  }
  document.getElementById("view-schedule").innerHTML=h;
  const f=document.getElementById("shiftForm"); if(f) f.scrollIntoView({block:"nearest"});

function openShiftForm(id,dateISO){
  if(!DB.staff.length){ toast("Add staff members first (Staff tab).","info"); return; }
  if(id){ const s=DB.shifts.find(x=>x.id===id); shiftDraft={id:s.id,staffId:s.staffId,date:s.date,start:s.start,end:s.end,role:s.role}; }
  else shiftDraft={id:null,staffId:DB.staff[0].id,date:dateISO||todayISO(),start:"09:00",end:"17:00",role:""};

function bracketTax(annual, brackets){
  let tax=0, prev=0;
  for(const [cap,rate] of brackets){
    if(annual<=prev) break;
    tax += (Math.min(annual,cap)-prev)*rate; prev=cap;
  }
  return tax;
}
// Simplified Ontario payroll ESTIMATE for one pay period. Not CRA-accurate to the penny.
function payrollEstimate(gross, periodType){
  const n=PAY_PERIODS[periodType]||52;
  const cppCap=TAX.cppYmpe/n, cppEx=TAX.cppExempt/n;
  const cpp=Math.max(0, Math.min(gross,cppCap)-cppEx)*TAX.cppRate;
  const ei=Math.min(gross, TAX.eiMie/n)*TAX.eiRate;
  const annual=gross*n;
  const fed=Math.max(0, bracketTax(annual,TAX.fedBrackets)-TAX.fedBPA*0.14)/n;
  const ont=Math.max(0, bracketTax(annual,TAX.onBrackets)-TAX.onBPA*0.0505)/n;
  const total=cpp+ei+fed+ont;
  return {gross,cpp,ei,fedTax:fed,onTax:ont,total,net:gross-total};
}

             : payCtx.periodType==="monthly"? addDaysISO(payCtx.periodStart,30) : addDaysISO(payCtx.periodStart,6);

// Downscale/compress a receipt photo before storing (keeps localStorage small)
function handleReceipt(ev){
  const f=ev.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=function(){
    try{
      const MAX=700, scale=Math.min(1, MAX/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      pendingReceipt=c.toDataURL("image/jpeg",0.65);
      document.getElementById("exPrev").innerHTML='<img class="thumb" src="'+pendingReceipt+'" alt="receipt preview">';
      URL.revokeObjectURL(img.src);
    }catch(e){ toast("Could not process that photo.","error"); }
  };
  img.onerror=function(){ toast("Could not read that photo.","error"); };
  img.src=URL.createObjectURL(f);
}

/* ---------------- 14. REPORTS ---------------- */
let repFrom=null, repTo=null;
function reportPreset(p){
  const t=todayISO();
  if(p==="week"){ const m=mondayISO(t); repFrom=m; repTo=addDaysISO(m,6); }
  else if(p==="lastweek"){ const m=addDaysISO(mondayISO(t),-7); repFrom=m; repTo=addDaysISO(m,6); }
  else if(p==="month"){ repFrom=t.slice(0,7)+"-01"; repTo=t; }
  else if(p==="lastmonth"){ const d=parseISO(t); d.setDate(1); d.setMonth(d.getMonth()-1);
    repFrom=isoOf(d); const e=new Date(d.getFullYear(),d.getMonth()+1,0); repTo=isoOf(e); }
  renderReports();
}
function renderReports(){
  if(!repFrom){ reportPresetSilent("month"); }
  const sales=DB.sales.filter(s=>s.date>=repFrom&&s.date<=repTo)
    .reduce((n,s)=>n+s.dinein+s.takeout+s.delivery+s.catering,0);
  const exps=DB.expenses.filter(e=>e.date>=repFrom&&e.date<=repTo);
  const expT=exps.reduce((n,e)=>n+e.amount,0);
  const hrs=hoursInRange(repFrom,repTo);
  const labour=Object.keys(hrs).reduce((n,id)=>{const s=staffById(id);return n+(s?hrs[id]*s.wage:0);},0);
  const labourPct=sales>0? (labour/sales*100):0;
  const net=sales-expT-labour;
  const byCat=EXPENSE_CATS.map(c=>({c,t:exps.filter(e=>e.category===c).reduce((n,e)=>n+e.amount,0)}))
    .filter(x=>x.t>0).sort((a,b)=>b.t-a.t);
  const maxCat=byCat.length?byCat[0].t:1;
  let h='<div class="card no-print"><h3>Period</h3><div class="btn-row">'+
    '<button class="btn btn-ghost" onclick="reportPreset(\'week\')">This week</button>'+
    '<button class="btn btn-ghost" onclick="reportPreset(\'lastweek\')">Last week</button>'+
    '<button class="btn btn-ghost" onclick="reportPreset(\'month\')">This month</button>'+
    '<button class="btn btn-ghost" onclick="reportPreset(\'lastmonth\')">Last month</button></div>'+
    '<p class="hint">'+fmtDate(repFrom)+' – '+fmtDate(repTo)+'</p></div>';
  h+='<div class="card"><h3>Summary</h3>'+
    '<div class="kv"><span class="k">Total sales</span><span class="v">'+money(sales)+'</span></div>'+
    '<div class="kv"><span class="k">Total expenses</span><span class="v">'+money(expT)+'</span></div>'+
    '<div class="kv"><span class="k">Labour cost <span class="hint">(time clock × wages)</span></span><span class="v">'+money(labour)+'</span></div>'+
    '<div class="kv"><span class="k">Labour as % of sales</span><span class="v">'+labourPct.toFixed(1)+'%</span></div>'+
    '<div class="kv"><span class="k"><b>Net estimate</b></span><span class="v big">'+money(net)+'</span></div></div>';
  h+='<div class="card"><h3>Expenses by category</h3>';
  h+= byCat.length? byCat.map(x=>'<div class="bar-row"><div class="bar-lbl">'+esc(x.c)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,Math.round(x.t/maxCat*100))+'%"></div></div>'+
      '<div class="bar-val">'+money(x.t)+'</div></div>').join("")
      : emptyInline("trenddown","No expenses in this period.");
  h+='</div>';
  h+='<div class="card"><h3>Sales channels</h3>';
  const ch={dinein:0,takeout:0,delivery:0,catering:0};
  DB.sales.filter(s=>s.date>=repFrom&&s.date<=repTo).forEach(s=>{ch.dinein+=s.dinein;ch.takeout+=s.takeout;ch.delivery+=s.delivery;ch.catering+=s.catering;});
  const maxCh=Math.max(1,ch.dinein,ch.takeout,ch.delivery,ch.catering);
  h+= ["dinein","takeout","delivery","catering"].map(k=>'<div class="bar-row"><div class="bar-lbl">'+k[0].toUpperCase()+k.slice(1)+
      '</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,Math.round(ch[k]/maxCh*100))+'%;background:var(--blue-ink)"></div></div>'+
      '<div class="bar-val">'+money(ch[k])+'</div></div>').join("");
  h+='</div>';
  h+='<div class="disclaimer">'+esc(DISCLAIMER)+'</div>';
  h+='<div class="no-print"><button class="btn btn-blue" onclick="window.print()">'+ic("printer")+' Print report</button></div>';
  document.getElementById("view-reports").innerHTML=h;
  animateBars(document.getElementById("view-reports"));
}
function reportPresetSilent(p){
  const t=todayISO();
  if(p==="month"){ repFrom=t.slice(0,7)+"-01"; repTo=t; }
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="restaurant-ops-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      if(!d||d.v!==1||!Array.isArray(d.staff)||!Array.isArray(d.shifts)) throw new Error("bad file");
      confirmDialog({title:"Replace all data?",message:"This replaces ALL current data on this device with the backup file.",confirmLabel:"Replace data",danger:true}).then(function(ok){
        if(!ok) return;
        DB=Object.assign(blankDB(),d); saveDB(); updateHead(); showTab("home");
        toast("Backup imported.","success");
      });
    }catch(e){ toast("That file doesn't look like a Restaurant Ops Hub backup.","error"); }
  };
  r.readAsText(f); ev.target.value="";
}
function eraseAll(){
  confirmDialog({title:"Erase everything?",message:"This deletes ALL data on this device and cannot be undone.",confirmLabel:"Erase everything",cancelLabel:"Keep my data",danger:true}).then(function(ok){
    if(!ok) return;
    confirmDialog({title:"Last chance",message:"Really delete all data? This is permanent.",confirmLabel:"Yes, erase it all",cancelLabel:"Cancel",danger:true}).then(function(ok2){
      if(!ok2) return;
      localStorage.removeItem(DB_KEY);
      DB=blankDB(); saveDB();
      payCtx={staffId:null,periodType:"weekly",periodStart:null,hours:null};
      repFrom=null; repTo=null; schedOffset=0; shiftDraft=null; staffDraft=null;
      updateHead(); showTab("settings");
    });
  });
}
